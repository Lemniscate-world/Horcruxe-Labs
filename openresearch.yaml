# OpenResearch project — Horcruxe Labs LABO (toutes recherches)

Root = `main`. 1 recherche = 1 groupe d'expériences. 1 hypothèse = 1 worktree.

project:
  name: horcruxe-labs
  repo: C:\Users\Utilisateur\Documents\Horcruxe Labs
  root_branch: main

groups:
  - recherche: 001-memoire-araignee
    baseline: python recherches/001-memoire-araignee/code/bench_v2.py --n 2000 --queries 30 --seed 42
    experiments: [H001-math-notation, H003-graph-weaver]
  - recherche: 002-xxx  # template : copier ce bloc pour chaque nouvelle recherche
    baseline: python recherches/002-xxx/code/bench_v1.py --seed 42
    experiments: [H001]

workflow:
  auto: .\scripts\orx_auto.ps1        # 1 commande : dashboard + baseline + exps + scoreboard
  agent_sans_orx: python scripts/agent_loop.py --once  # même chose sans daemon, pour toutes recherches
  classement: python scripts/scoreboard.py  # papers/SCOREBOARD.md labo entier
